<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `flutter build web --base-href`; "/" when served at the site root. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="NaviVibe: your music from your own server. Smart Shuffle, Flow and Jam with friends.">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="same-origin">

  <!-- Installed on iOS / Android -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NaviVibe">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>NaviVibe</title>
  <style>
    /* Black from the first paint: no white flash before Flutter draws. */
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #nv-splash {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      transition: opacity .25s ease-out;
    }
    #nv-splash img { width: 96px; height: 96px; border-radius: 22px; opacity: .92; }
  </style>
</head>
<body>
  <div id="nv-splash" aria-hidden="true"><img src="icons/Icon-192.png" alt=""></div>
  <!-- No inline scripts: the deployed CSP allows only same-origin script files. -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
