<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lyrics with word-by-word fill</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;box-sizing:border-box;font-family:Inter,sans-serif;color:#fff;background:linear-gradient(180deg,#2e2478 0%,#1a1346 52%,#08080f 100%)">

<div style="position:absolute;top:10px;left:177px;width:36px;height:5px;border-radius:3px;background:rgba(255,255,255,.35)"></div>

<div style="position:absolute;top:48px;left:16px;right:16px;display:flex;align-items:center;gap:12px">
<button aria-label="Close lyrics" style="all:unset;box-sizing:border-box;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
<button aria-label="Translate" style="all:unset;box-sizing:border-box;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h9M8.5 4v2M6 6c.8 3.4 3.4 6 6.5 7M12 6c-.8 3.4-3.6 6.4-8 7.6"/><path d="M13.5 20l3.5-8 3.5 8M14.8 17h4.4"/></svg></button>
<div style="flex:1"></div>
<div style="width:56px;height:56px;border-radius:8px;background:radial-gradient(circle at 68% 30%,rgba(255,255,255,.30) 0,rgba(255,255,255,.30) 21%,rgba(255,255,255,0) 21.5%),linear-gradient(135deg,#2d33e0 0%,#7b3df0 55%,#d9479b 100%)"></div>
</div>

<div style="position:absolute;top:140px;left:24px;right:24px;display:flex;flex-direction:column;gap:24px;font-size:26px;font-weight:700;letter-spacing:-.3px;line-height:1.3">
<div style="color:rgba(255,255,255,.42)">An earlier line, already sung and dimmed</div>
<div style="color:rgba(255,255,255,.42)">The line just before this one</div>
<div><span style="color:#fff">The line being sung fills</span><span style="color:rgba(255,255,255,.42)"> in, word by word, as it is sung</span></div>
<div style="color:rgba(255,255,255,.55)">The next line waits, a little brighter</div>
<div style="color:rgba(255,255,255,.42)">Then the one after that, quieter again</div>
<div style="color:rgba(255,255,255,.42)">A last line, still out of focus</div>
</div>

<div style="position:absolute;left:0;right:0;bottom:44px;display:flex;justify-content:center">
<button aria-label="Lyrics source: lrc.red, word synced" style="all:unset;box-sizing:border-box;height:44px;padding:0 18px;border-radius:22px;background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;gap:10px;cursor:pointer">
<span style="font-size:15px;font-weight:600">lrc.red</span>
<span style="font-size:11px;font-weight:600;letter-spacing:.08em;color:#D6D6DE;background:rgba(255,255,255,.12);border-radius:6px;padding:3px 7px">WORD SYNC</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
