name: navivibe
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Audio
  just_audio: ^0.10.5
  audio_session: ^0.2.3

  # State management
  flutter_riverpod: ^3.1.0          # providers are hand-written (no codegen)

  # Navigation — using direct Navigator push/pop throughout the app
  # go_router removed (ARCH-1): declared but never imported anywhere

  # HTTP & storage
  http: ^1.2.0
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.3.1   # Legacy — being migrated to Hive CE
  flutter_secure_storage: ^10.3.1
  crypto: ^3.0.3
  archive: ^4.0.9               # pure-Dart bzip2, for applying update patches
  file_picker: ^8.1.7
  hive_ce: ^2.6.0              # Fast key-value store (community edition)
  hive_ce_flutter: ^2.1.0      # Flutter init + path resolution

  # UI
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.3.1
  # Both already resolved through cached_network_image; declared directly
  # for the player's artwork path: the server resizes the cover to 64px and
  # it is decoded on the CPU (GPU pixel readback hangs on some Impeller
  # devices).
  flutter_cache_manager: ^3.4.2
  image: ^4.1.2
  marquee: ^2.3.0
  connectivity_plus: ^7.1.1
  drift: ^2.22.1
  drift_flutter: ^0.2.8
  path_provider: ^2.1.5
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_windows_audio: ^1.0.9
  uuid: ^4.5.3
  audio_service: ^0.18.18
  audio_service_mpris: ^0.2.1   # Linux MPRIS D-Bus media control integration
  window_manager: ^0.5.1        # Desktop window size/position management
  fl_chart: ^1.2.0
  collection: ^1.19.1
  package_info_plus: ^9.0.1
  device_info_plus: ^12.4.0
  share_plus: ^12.0.2
  record: ^7.1.2
  permission_handler: ^13.0.2
  speech_to_text: ^7.5.0
  tray_manager: ^0.5.2
  audio_metadata_reader: ^1.8.1
  disk_space_plus: ^0.2.6
  cryptography: ^2.9.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  # mesh_gradient removed (ARCH-2): declared but never imported anywhere

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.4.9
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0
  drift_dev: ^2.22.1
  sqlite3_flutter_libs: ^0.5.42
  mocktail: ^1.0.5
  sqlite3: ^2.9.4
  rxdart: ^0.28.0
  stream_channel: ^2.1.2

flutter:
  uses-material-design: true
  shaders:
    - shaders/artwork_field.frag
  # Tab icons: a still (resting) frame plus a one-shot animation each, and
  # illustration stills for empty states.
  assets:
    - assets/icons/
    # Ionicons v7 glyphs (MIT), white PNGs tinted at draw time; see Ion.
    - assets/tray/
  # Inter 4.1 (SIL OFL, assets/fonts/Inter-OFL-LICENSE.txt). Bundled so the
  # first launch and offline launches render the real face, never a fallback.
  # "Inter" is the text cut; "InterDisplay" is the optical cut for ≥20pt type.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: InterDisplay
      fonts:
        - asset: assets/fonts/InterDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/InterDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InterDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/InterDisplay-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "/home/subi/Documents/music/navivibe/music.png"
  min_sdk_android: 21
