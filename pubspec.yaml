name: navivibe
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Audio
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.13
  audio_session: ^0.2.3

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Navigation — using direct Navigator push/pop throughout the app
  # go_router removed (ARCH-1): declared but never imported anywhere

  # HTTP & storage
  http: ^1.2.0
  dio: ^5.7.0
  http_parser: ^4.0.0
  shared_preferences: ^2.3.1   # Legacy — being migrated to Hive CE
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3
  file_picker: ^8.0.3
  sqflite: ^2.3.3              # Legacy — being migrated to Drift
  path: ^1.9.0
  hive_ce: ^2.6.0              # Fast key-value store (community edition)
  hive_ce_flutter: ^2.1.0      # Flutter init + path resolution

  # UI
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.3.1
  palette_generator: ^0.3.3
  flutter_slidable: ^3.1.2
  google_fonts: ^8.0.2
  animations: ^2.1.2
  flutter_animate: ^4.5.2
  marquee: ^2.3.0
  audio_video_progress_bar: ^2.0.3
  connectivity_plus: ^7.1.1
  drift: ^2.22.1
  drift_flutter: ^0.1.0
  path_provider: ^2.1.5
  # mesh_gradient removed (ARCH-2): declared but never imported anywhere

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.3
  custom_lint: ^0.7.6
  riverpod_lint: ^2.3.13
  drift_dev: ^2.22.1

flutter:
  uses-material-design: true
  shaders:
    - shaders/fluid_background.frag

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "/home/subi/Documents/music/navivibe/music.png"
  min_sdk_android: 21
