name: Clean up pre-releases

# Daily safety net. After every release, release.yml already runs the same script
# (tool/release/cleanup_prereleases.sh) once; this workflow has no push or
# workflow_call trigger, so it can never run more than once per release.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: cleanup-prereleases
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6.1.0
      - run: bash tool/release/cleanup_prereleases.sh
