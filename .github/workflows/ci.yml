name: CI

# No secrets are used here, so pull requests from forks are safe to run.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true # caches the Flutter SDK and ~/.pub-cache

      - name: Cache Gradle
        uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      # The update-patch tests build their sample with the same bsdiff4 call CI uses.
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install bsdiff4

      - run: flutter pub get
      - run: flutter analyze lib
      # Goldens are recorded on Windows and differ on Linux text rendering, so they
      # run locally only. The expanded reporter lists every failing test by name.
      - run: flutter test --exclude-tags golden --reporter expanded
