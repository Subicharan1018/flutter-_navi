name: Release

# Every push to any branch publishes a GitHub Release: main as a normal ("latest")
# release, every other branch as a pre-release, so "latest" is never hijacked.
# Put [skip release] in the head commit message to skip publishing (CI still runs).
# There is no pull_request trigger, so forks never reach the signing secrets.
on:
  push:
    branches: ['**']
    tags-ignore: ['**'] # the release's own tag must not start another run
  workflow_dispatch:
    inputs:
      personal_build:
        description: >-
          Build WITHOUT the public-build switch (keeps Search Online and the other
          download features). Nothing is published: you get workflow artifacts that
          expire after 1 day. Artifacts of a public repository can be downloaded by
          any signed-in GitHub user, so prefer tool/make_release_local.ps1 for this.
        type: boolean
        default: false

# Rapid pushes to one branch: only the newest gets published.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Build numbers must only ever go up, and must stay above the versionCode of
  # the APKs people already have installed (pubspec says +2). Raise the repo
  # variable BUILD_NUMBER_OFFSET if you ever need to jump ahead.
  BUILD_OFFSET: ${{ vars.BUILD_NUMBER_OFFSET || '100' }}

jobs:
  version:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      build: ${{ steps.v.outputs.build }}
      tag: ${{ steps.v.outputs.tag }}
      win: ${{ steps.v.outputs.win }}
      public: ${{ steps.v.outputs.public }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4.2.2
      - id: v
        env:
          PERSONAL: ${{ inputs.personal_build }}
        run: |
          set -euo pipefail
          full=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          name=${full%%+*}
          build=$(( ${GITHUB_RUN_NUMBER} + ${BUILD_OFFSET} ))
          major=${name%%.*}; rest=${name#*.}; minor=${rest%%.*}
          {
            echo "name=$name"
            echo "build=$build"
            echo "tag=v$name+$build"
            # Velopack wants plain SemVer: MAJOR.MINOR.BUILD
            echo "win=$major.$minor.$build"
            # Downloads are on in every build. Who may use them is decided by the
            # server (login + its download access list), not by the app build.
            # Set `public=true` here to publish the build without the download UI.
            echo "public=false"
            # Whether this run is released: a manual 'personal_build' run stops at artifacts.
            if [ "$PERSONAL" = "true" ]; then echo "publish=false"; else echo "publish=true"; fi
          } >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing or empty secrets:$missing. They must be repository secrets (Settings > Secrets and variables > Actions > Repository secrets), not Dependabot or environment secrets, and the names must match exactly. Without the same signing key phones cannot update in place; see docs/RELEASING.md."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "NAVI_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - run: flutter pub get

      - name: Build APKs
        env:
          NAVI_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          NAVI_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          NAVI_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          NAME: ${{ needs.version.outputs.name }}
          BUILD: ${{ needs.version.outputs.build }}
          PUBLIC: ${{ needs.version.outputs.public }}
        run: |
          set -euo pipefail
          flags="--release --build-name=$NAME --build-number=$BUILD --dart-define=NAVI_BUILD=$BUILD"
          if [ "$PUBLIC" = "true" ]; then flags="$flags --dart-define=PUBLIC_BUILD=true"; fi
          flutter build apk $flags --split-per-abi
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "dist/NaviVibe-$abi.apk"
          done
          flutter build apk $flags
          cp build/app/outputs/flutter-apk/app-release.apk dist/NaviVibe-universal.apk

      - name: Verify native libs are stored uncompressed
        run: python3 tool/release/verify_apk.py dist/NaviVibe-arm64-v8a.apk dist/NaviVibe-armeabi-v7a.apk dist/NaviVibe-x86_64.apk

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: android
          path: dist/*.apk
          retention-days: ${{ needs.version.outputs.publish == 'true' && 90 || 1 }}
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: '8.0.x'
      - run: flutter pub get
      - name: Build Windows
        shell: pwsh
        env:
          NAME: ${{ needs.version.outputs.name }}
          BUILD: ${{ needs.version.outputs.build }}
          PUBLIC: ${{ needs.version.outputs.public }}
        run: |
          $defs = @("--dart-define=NAVI_BUILD=$env:BUILD")
          if ($env:PUBLIC -eq 'true') { $defs += '--dart-define=PUBLIC_BUILD=true' }
          flutter build windows --release "--build-name=$env:NAME" "--build-number=$env:BUILD" @defs

      - name: Package (zip + Velopack installer)
        shell: pwsh
        env:
          WINVER: ${{ needs.version.outputs.win }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = 'build\windows\x64\runner\Release'
          New-Item -ItemType Directory -Force winout | Out-Null
          Compress-Archive -Path "$rel\*" -DestinationPath winout\NaviVibe-windows-x64.zip
          dotnet tool install -g vpk
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          # Earlier releases give vpk what it needs to build delta packages.
          # The first release has none, so a failure here is fine.
          try { vpk download github --repoUrl "https://github.com/$env:REPO" --token $env:GH_TOKEN -o Releases } catch { Write-Host 'no earlier releases to diff against' }
          vpk pack --packId NaviVibe --packVersion $env:WINVER --packDir $rel --mainExe navivibe.exe --packTitle NaviVibe -o Releases
          if ($LASTEXITCODE -ne 0) { throw 'vpk pack failed' }
          # Only this build's files go into the release (Releases/ also holds older nupkgs).
          Get-ChildItem Releases | Where-Object { $_.Name -match "$($env:WINVER -replace '\.','\.')" -or $_.Name -like 'releases.*.json' -or $_.Name -like 'RELEASES*' -or $_.Name -like '*Setup.exe' } | Copy-Item -Destination winout
          Get-ChildItem winout

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: windows
          path: winout/*
          retention-days: ${{ needs.version.outputs.publish == 'true' && 90 || 1 }}
          if-no-files-found: error

  publish:
    # A manual 'personal_build' run stops at the (1-day) workflow artifacts; every other run is released.
    if: needs.version.outputs.publish == 'true'
    needs: [version, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write # only this job may create the release and tag
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - run: pip install bsdiff4

      - uses: actions/download-artifact@v4.3.0
        with: { name: android, path: dist }
      - uses: actions/download-artifact@v4.3.0
        with: { name: windows, path: windist }

      - name: Fetch earlier builds for patches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p prev
          # Patches are cut against the last 3 normal releases plus the last 2
          # pre-releases, whichever branch they came from. A phone on any of
          # them gets a small patch; anything older gets the full APK.
          gh release list --limit 40 --json tagName,isPrerelease > releases.json
          tags=$(python3 - <<'PY'
          import json
          rs = json.load(open("releases.json"))
          pick = [r["tagName"] for r in rs if not r["isPrerelease"]][:3] +                  [r["tagName"] for r in rs if r["isPrerelease"]][:2]
          print(" ".join(pick))
          PY
          )
          for tag in $tags; do
            b=${tag##*+}
            case "$b" in ''|*[!0-9]*) continue ;; esac
            mkdir -p "prev/$b"
            gh release download "$tag" --pattern 'NaviVibe-*-*.apk' --dir "prev/$b" || true
          done
          ls -R prev || true

      - name: Release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -uo pipefail
          prev=$(gh release list --limit 1 --json tagName -q '.[0].tagName' || true)
          if [ -n "$prev" ] && git rev-parse -q --verify "refs/tags/$prev" >/dev/null; then
            range="$prev..HEAD"
          else
            range="-n 20"
          fi
          git log $range --no-merges --pretty='- %s' > notes.md
          [ -s notes.md ] || echo '- Maintenance build' > notes.md

      - name: Package patches and manifest
        env:
          NAME: ${{ needs.version.outputs.name }}
          BUILD: ${{ needs.version.outputs.build }}
          TAG: ${{ needs.version.outputs.tag }}
          REPO: ${{ github.repository }}
          CHANNEL: ${{ github.ref == 'refs/heads/main' && 'stable' || 'beta' }}
        run: |
          set -euo pipefail
          tagurl=$(python3 -c "import urllib.parse,os;print(urllib.parse.quote(os.environ['TAG']))")
          python3 tool/release/package_release.py \
            --apk-dir dist --prev-dir prev --out out \
            --version "$NAME" --build "$BUILD" --tag "$TAG" \
            --asset-base "https://github.com/$REPO/releases/download/$tagurl/" \
            --notes-file notes.md --windows-dir windist --max-patches 5             --channel "$CHANNEL"
          cp dist/*.apk windist/* out/
          ls -l out

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$IS_MAIN" = "true" ]; then
            title="NaviVibe $TAG"
            flags="--latest"
          else
            title="NaviVibe $TAG ($BRANCH)"
            flags="--prerelease --latest=false"
          fi
          gh release create "$TAG" out/* $flags             --target "$GITHUB_SHA" --title "$title" --notes-file notes.md

  cleanup:
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/cleanup-prereleases.yml
